<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --line:#d0d0d0;
  --line-strong:#8a8a8a;
  --ink:#000;
  --muted:#6a6a6a;
  --now:#fff6c8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#fff;color:var(--ink)}
body{
  font-family:Arial,Roboto,Helvetica,"Helvetica Neue",sans-serif;
  font-size:16px;line-height:1.3;
  padding-bottom:calc(43px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
  touch-action:manipulation;
}
button{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);padding:7px 12px;cursor:pointer}
button:active{background:#f0f0f0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #000;outline-offset:-2px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line-strong);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:stretch;height:44px}
.bar button{border:0;border-left:1px solid var(--line);background:#fff;padding:0}
.bar button:first-child{border-left:0}
.nav{width:44px;font-size:24px;line-height:1}
.date{flex:1;font-size:15px;white-space:nowrap;overflow:hidden}
.todaybar{border-top:1px solid var(--line);padding:6px 8px}
.todaybar button{border:0;padding:2px 0;font-size:13px;color:var(--muted);text-decoration:underline}

/* ---------- grid ---------- */
.row{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:36px}
.row:first-child{border-top:0}
.row.hour{border-top:1px solid var(--line-strong)}
.row.cont{border-top-color:transparent}
.time{
  flex:0 0 62px;padding:10px 6px 0 0;text-align:right;
  font-size:12px;color:var(--muted);
  -webkit-user-select:none;user-select:none
}
.tools{flex:0 0 54px;display:flex;align-items:stretch;border-right:1px solid var(--line)}
.tools button{flex:1;border:0;background:transparent;padding:0;line-height:1;visibility:hidden}
.row.filled .tools button{visibility:visible}
.tools button:active{background:#ececec}
.tools .del{color:#c00000;font-size:19px}
.tools .ext{color:#000;font-size:15px}
.row.hour .time{color:var(--ink);font-weight:bold}
.ap{font-size:10px;margin-left:3px;font-weight:normal;color:var(--muted)}
.row.now .ap,.row.hour .ap{color:var(--ink)}
.cell{flex:1;position:relative;min-width:0}
.cell input{
  width:100%;height:100%;min-height:36px;border:0;background:transparent;
  font-family:inherit;font-size:16px;line-height:1.3;color:var(--ink);padding:9px 26px 9px 8px;
}
.cell input:read-only{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell input:focus{outline:none}
.row.cont .cell input{color:transparent;caret-color:#000}
.row.cont .cell input:focus{color:var(--ink)}
.row.now{background:var(--now)}
.row.now .time{box-shadow:inset 3px 0 0 #000;font-weight:bold;color:#000}
.flag,.hit{display:none}
.note .flag{
  display:block;position:absolute;top:0;right:0;width:0;height:0;
  border-top:9px solid #000;border-left:9px solid transparent;pointer-events:none
}
.cell.note .hit{display:block;position:absolute;top:0;right:0;width:28px;height:100%}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:9;background:#fff;
  border-top:1px solid #000;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
}
.sheet h2{margin:0 0 10px;font-size:14px;font-weight:bold}
.sheet .close{position:absolute;top:8px;right:8px;border:0;font-size:20px;padding:4px 8px}
.menu{padding:0}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:14px;font-size:16px}
.menu button:last-child{border-bottom:0}
textarea{
  width:100%;min-height:120px;border:1px solid var(--line-strong);padding:8px;
  font-family:inherit;font-size:16px;line-height:1.4;color:var(--ink);background:#fff;resize:vertical
}
select,input[type=date]{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line-strong);padding:7px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
.actions .danger{border-color:#000}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}

/* ---------- view tabs ---------- */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;
  background:#ededed;border-top:1px solid var(--line-strong);
  padding-bottom:env(safe-area-inset-bottom)
}
.tab{
  flex:1;height:42px;border:0;border-right:1px solid var(--line);
  background:#ededed;color:#555;font-size:14px
}
.tab:last-child{border-right:0}
.tab.on{background:#fff;color:#000;font-weight:bold;box-shadow:inset 0 2px 0 #000}
.tab .badge{color:#c00000;font-weight:bold;margin-left:5px}

/* ---------- list view ---------- */
.bar .vtitle{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:15px;border-left:1px solid var(--line)
}
.legend{
  padding:7px 10px;font-size:11px;color:var(--muted);
  border-bottom:1px solid var(--line);background:#fafafa
}
.sect{
  background:#f1f1f1;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);
  padding:5px 10px;font-size:11px;font-weight:bold;letter-spacing:.05em;color:#3d3d3d
}
.sect.red{color:#c00000}
.item{display:flex;align-items:stretch;border-top:1px solid var(--line);min-height:48px}
.item:first-child{border-top:0}
.due{
  flex:0 0 62px;padding:9px 6px 0 0;text-align:right;
  font-size:13px;color:var(--ink);
  -webkit-user-select:none;user-select:none
}
.due .wd{font-size:10px;color:var(--muted);margin-top:1px}
.due.over,.due.over .wd{color:#c00000}
.due .nod{color:var(--muted)}
.st{flex:0 0 54px;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line)}
.box{
  width:20px;height:20px;border:1.5px solid #000;background:#fff;padding:0;
  position:relative;flex:none
}
.box i{position:absolute;left:0;right:0;top:0;bottom:0;font-style:normal}
.box.s1 i{left:3px;right:3px;top:3px;bottom:3px;background:#000}
.box.s2 i{
  font-size:15px;font-weight:bold;line-height:17px;text-align:center;color:#000
}
.itext{flex:1;position:relative;min-width:0;padding:9px 22px 9px 9px}
.ttl{word-wrap:break-word;overflow-wrap:break-word}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.item.done .ttl{text-decoration:line-through;color:#818181}
.item.done .due,.item.done .due .wd{color:#818181}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.sheet input[type=text]{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
  border:1px solid var(--line-strong);padding:9px;margin-bottom:9px
}
.pick{display:flex;margin:0 0 10px}
.pick button{flex:1;margin-left:-1px;font-size:13px;padding:9px 2px}
.pick button:first-child{margin-left:0}
.pick button.on{background:#000;color:#fff;border-color:#000}
[hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Previous day">&#8249;</button>
    <button class="date" id="dateBtn"><span id="dateTxt">&nbsp;</span></button>
    <button class="nav" id="next" aria-label="Next day">&#8250;</button>
    <div class="vtitle" id="vtitle" hidden>All items</div>
    <button class="nav" id="addBtn" aria-label="New item" hidden>+</button>
    <button class="nav" id="menuBtn" aria-label="Menu">&#9776;</button>
  </div>
  <div class="todaybar" id="todayBar" hidden><button id="todayBtn">Back to today</button></div>
</header>

<main id="grid"></main>
<main id="list" hidden></main>

<nav class="tabs">
  <button class="tab on" id="tabDay">Day</button>
  <button class="tab" id="tabList">List<span class="badge" id="tabCount"></span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet menu" id="menuSheet" hidden>
  <button id="mCopy" class="dayOnly">Copy another day here</button>
  <button id="mClear" class="dayOnly">Clear this day</button>
  <button id="mHours" class="dayOnly">Hours shown</button>
  <button id="mClearDone" class="listOnly">Delete finished items</button>
  <button id="mExport">Save backup file</button>
  <button id="mImport">Load backup file</button>
</div>

<div class="sheet" id="noteSheet" hidden>
  <button class="close" id="noteClose" aria-label="Close">&times;</button>
  <h2 id="noteTitle">Note</h2>
  <textarea id="noteText" placeholder="Note for this slot"></textarea>
  <div class="actions">
    <button id="noteDelete">Delete note</button>
    <button id="noteSave">Save note</button>
  </div>
</div>

<div class="sheet" id="copySheet" hidden>
  <button class="close" id="copyClose" aria-label="Close">&times;</button>
  <h2>Copy another day here</h2>
  <p class="hint" id="copyHint">Everything on the day you are viewing is replaced.</p>
  <div class="row2">
    <button id="cYest">Yesterday</button>
    <button id="cWeek">Same day last week</button>
  </div>
  <div class="row2">
    <input type="date" id="cDate">
    <button id="cGo">Copy this date</button>
  </div>
</div>

<div class="sheet" id="hoursSheet" hidden>
  <button class="close" id="hoursClose" aria-label="Close">&times;</button>
  <h2>Hours shown</h2>
  <p class="hint">Slots outside this range are hidden, not deleted.</p>
  <div class="row2">
    <label for="hStart">From</label><select id="hStart"></select>
    <label for="hEnd">to</label><select id="hEnd"></select>
  </div>
  <div class="actions"><button id="hSave">Save hours</button></div>
</div>

<div class="sheet" id="itemSheet" hidden>
  <button class="close" id="itemClose" aria-label="Close">&times;</button>
  <h2 id="itemH2">New item</h2>
  <input type="text" id="iTitle" placeholder="What needs doing?" autocomplete="off" autocapitalize="sentences">
  <div class="row2">
    <label for="iDue">Due</label>
    <input type="date" id="iDue">
    <button id="iNoDate">No date</button>
  </div>
  <input type="text" id="iSubj" placeholder="Subject (optional)" list="subjList" autocomplete="off">
  <datalist id="subjList"></datalist>
  <div class="pick" id="iPick">
    <button data-s="0">Not started</button>
    <button data-s="1">Scheduled</button>
    <button data-s="2">Done</button>
  </div>
  <textarea id="iNote" placeholder="Notes (optional)"></textarea>
  <div class="actions">
    <button id="iDelete">Delete</button>
    <button id="iSave">Save</button>
  </div>
</div>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";

var WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var PREFIX="planner.day.";

function pad(n){return n<10?"0"+n:""+n}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function shift(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function longLabel(s){var d=parseISO(s);return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]+" "+d.getFullYear()}
function shortLabel(s){var d=parseISO(s);return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]}
function clockParts(i){
  var h=Math.floor(i/4)%24, m=(i%4)*15, suffix=(h<12?"AM":"PM"), h12=h%12;
  if(h12===0) h12=12;
  return {time:h12+":"+pad(m), suffix:suffix};
}
function slotLabel(i){var c=clockParts(i);return c.time+" "+c.suffix}
function slotHTML(i){var c=clockParts(i);return c.time+'<span class="ap">'+c.suffix+"</span>"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function readDay(k){try{return JSON.parse(localStorage.getItem(PREFIX+k))||{}}catch(e){return {}}}

var settings={start:6,end:24};
try{var st=JSON.parse(localStorage.getItem("planner.settings"));if(st&&st.start!=null){settings=st}}catch(e){}

var cur=iso(new Date());
var day=readDay(cur);

var grid=document.getElementById("grid");
var dateTxt=document.getElementById("dateTxt");
var todayBar=document.getElementById("todayBar");

/* ---------- storage ---------- */
function saveDay(){
  var k=PREFIX+cur;
  if(Object.keys(day).length) localStorage.setItem(k,JSON.stringify(day));
  else localStorage.removeItem(k);
}
function setSlot(i,text,note){
  var o=day[i]||{};
  if(text!==undefined){ if(text) o.t=text; else delete o.t; }
  if(note!==undefined){ if(note) o.n=note; else delete o.n; }
  if(!o.t&&!o.n) delete day[i]; else day[i]=o;
  saveDay();
}

/* ---------- render ---------- */
function render(){
  dateTxt.textContent=longLabel(cur);
  todayBar.hidden=(cur===iso(new Date()));
  var s=settings.start*4, e=settings.end*4, out=[];
  for(var i=s;i<e;i++){
    var o=day[i]||{};
    out.push(
      '<div class="row'+(i%4===0?" hour":"")+'" data-i="'+i+'">'+
        '<div class="time">'+slotHTML(i)+'</div>'+
        '<div class="tools">'+
          '<button class="del" tabindex="-1" aria-label="Clear '+slotLabel(i)+'">&times;</button>'+
          '<button class="ext" tabindex="-1" aria-label="Copy '+slotLabel(i)+' into '+slotLabel(i+1)+'">&darr;</button>'+
        '</div>'+
        '<div class="cell'+(o.n?" note":"")+'">'+
          '<input type="text" readonly enterkeyhint="next" autocomplete="off" '+
                 'autocapitalize="sentences" spellcheck="false" value="'+esc(o.t||"")+'" '+
                 'aria-label="'+slotLabel(i)+'">'+
          '<span class="flag"></span><span class="hit"></span>'+
        '</div>'+
      '</div>');
  }
  grid.innerHTML=out.join("");
  markNow();
  paint();
}

function markNow(){
  var old=grid.querySelector(".row.now");
  if(old) old.classList.remove("now");
  if(cur!==iso(new Date())) return;
  var n=new Date(), i=Math.floor((n.getHours()*60+n.getMinutes())/15);
  var row=grid.querySelector('.row[data-i="'+i+'"]');
  if(row) row.classList.add("now");
}

function paint(){
  var rows=grid.children, prev=null;
  for(var k=0;k<rows.length;k++){
    var i=+rows[k].dataset.i;
    var v=rows[k].querySelector("input").value.trim();
    var hasNote=!!(day[i]&&day[i].n);
    rows[k].classList.toggle("cont", v!=="" && v===prev && i===+rows[k-1].dataset.i+1);
    rows[k].classList.toggle("filled", v!=="" || hasNote);
    prev=v;
  }
}

/* Redraw without losing the reader's place. */
function refresh(){
  var y=window.scrollY;
  render();
  window.scrollTo(0,y);
}

function clearSlot(i){
  if(day[i]&&day[i].n&&!confirm("Clear the plan and the note at "+slotLabel(i)+"?")) return;
  delete day[i]; saveDay(); refresh();
}

function extendSlot(i){
  var next=i+1;
  if(next>=settings.end*4||next>95) return;
  var src=day[i];
  if(!src||!src.t) return;
  var o=day[next]||{};
  o.t=src.t;
  day[next]=o; saveDay(); refresh();
}

function scrollToNow(){
  var row=grid.querySelector(".row.now");
  if(row) window.scrollTo(0,Math.max(0,row.offsetTop-140));
}

/* ---------- editing ---------- */
var lpTimer=null,lpFired=false,lx=0,ly=0;

grid.addEventListener("touchstart",function(e){
  var row=e.target.closest(".row"); if(!row||e.target.closest(".tools")) return;
  lpFired=false; lx=e.touches[0].clientX; ly=e.touches[0].clientY;
  clearTimeout(lpTimer);
  lpTimer=setTimeout(function(){
    lpFired=true;
    if(navigator.vibrate) navigator.vibrate(12);
    openNote(+row.dataset.i);
  },450);
},{passive:true});

grid.addEventListener("touchmove",function(e){
  if(Math.abs(e.touches[0].clientX-lx)>8||Math.abs(e.touches[0].clientY-ly)>8) clearTimeout(lpTimer);
},{passive:true});

grid.addEventListener("touchend",function(e){
  clearTimeout(lpTimer);
  if(lpFired){ e.preventDefault(); lpFired=false; }
},{passive:false});

grid.addEventListener("touchcancel",function(){clearTimeout(lpTimer)},{passive:true});

grid.addEventListener("contextmenu",function(e){
  var row=e.target.closest(".row"); if(!row) return;
  if(document.activeElement&&document.activeElement.tagName==="INPUT") return;
  e.preventDefault(); openNote(+row.dataset.i);
});

grid.addEventListener("click",function(e){
  var row=e.target.closest(".row"); if(!row) return;
  if(e.target.classList.contains("del")){ clearSlot(+row.dataset.i); return; }
  if(e.target.classList.contains("ext")){ extendSlot(+row.dataset.i); return; }
  if(e.target.classList.contains("hit")){ openNote(+row.dataset.i); return; }
  var inp=row.querySelector("input");
  if(document.activeElement===inp) return;
  inp.readOnly=false;
  inp.focus();
  try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(err){}
});

grid.addEventListener("input",function(e){
  if(e.target.tagName!=="INPUT") return;
  setSlot(+e.target.closest(".row").dataset.i,e.target.value.trim());
  paint();
});

grid.addEventListener("focusin",function(e){
  if(e.target.tagName==="INPUT") e.target.readOnly=false;
});

grid.addEventListener("focusout",function(e){
  if(e.target.tagName==="INPUT"){ e.target.readOnly=true; paint(); }
});

grid.addEventListener("keydown",function(e){
  if(e.target.tagName!=="INPUT"||e.key!=="Enter") return;
  e.preventDefault();
  var row=e.target.closest(".row").nextElementSibling;
  if(!row){ e.target.blur(); return; }
  var inp=row.querySelector("input");
  inp.readOnly=false; inp.focus();
});

/* ---------- overlays ---------- */
var scrim=document.getElementById("scrim");
var sheets=["menuSheet","noteSheet","copySheet","hoursSheet","itemSheet"].map(function(id){return document.getElementById(id)});

function closeAll(){
  sheets.forEach(function(s){s.hidden=true});
  scrim.hidden=true;
}
function open(el){
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  closeAll(); scrim.hidden=false; el.hidden=false;
}
scrim.addEventListener("click",closeAll);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeAll(); });

/* ---------- notes ---------- */
var noteSheet=document.getElementById("noteSheet");
var noteText=document.getElementById("noteText");
var noteI=null;

function openNote(i){
  noteI=i;
  document.getElementById("noteTitle").textContent=slotLabel(i)+" – "+slotLabel(i+1)+"  ·  "+shortLabel(cur);
  noteText.value=(day[i]&&day[i].n)||"";
  open(noteSheet);
  setTimeout(function(){noteText.focus()},50);
}
function writeNote(v){
  setSlot(noteI,undefined,v);
  var row=grid.querySelector('.row[data-i="'+noteI+'"]');
  if(row) row.querySelector(".cell").classList.toggle("note",!!v);
  closeAll();
}
document.getElementById("noteSave").onclick=function(){writeNote(noteText.value.trim())};
document.getElementById("noteDelete").onclick=function(){writeNote("")};
document.getElementById("noteClose").onclick=closeAll;

/* ---------- day navigation ---------- */
function go(d){
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  cur=d; day=readDay(cur); render(); window.scrollTo(0,0);
  if(cur===iso(new Date())) scrollToNow();
}
document.getElementById("prev").onclick=function(){go(shift(cur,-1))};
document.getElementById("next").onclick=function(){go(shift(cur,1))};
document.getElementById("todayBtn").onclick=function(){go(iso(new Date()))};

var picker=document.createElement("input");
picker.type="date";
picker.style.cssText="position:fixed;left:50%;top:0;width:1px;height:1px;opacity:0;border:0;padding:0";
document.body.appendChild(picker);
picker.addEventListener("change",function(){ if(picker.value) go(picker.value); });
document.getElementById("dateBtn").onclick=function(){
  picker.value=cur;
  if(picker.showPicker){ try{ picker.showPicker(); return; }catch(e){} }
  picker.click();
};

/* ---------- menu ---------- */
document.getElementById("menuBtn").onclick=function(){open(document.getElementById("menuSheet"))};

document.getElementById("mClear").onclick=function(){
  closeAll();
  if(!Object.keys(day).length) return;
  if(confirm("Delete everything on "+shortLabel(cur)+"?")){ day={}; saveDay(); render(); }
};

/* ---------- copy a day ---------- */
var copySheet=document.getElementById("copySheet");
document.getElementById("mCopy").onclick=function(){
  document.getElementById("cDate").value=shift(cur,-1);
  document.getElementById("copyHint").textContent="Everything on "+shortLabel(cur)+" is replaced.";
  document.getElementById("cWeek").textContent=WD[parseISO(cur).getDay()]+" last week";
  open(copySheet);
};
function copyFrom(src){
  if(src===cur){ alert("That is the day you are already on."); return; }
  var data=readDay(src);
  if(!Object.keys(data).length){ alert(shortLabel(src)+" is empty. Nothing to copy."); return; }
  if(!confirm("Replace "+shortLabel(cur)+" with "+shortLabel(src)+"?")) return;
  day=JSON.parse(JSON.stringify(data));
  saveDay(); closeAll(); render();
}
document.getElementById("cYest").onclick=function(){copyFrom(shift(cur,-1))};
document.getElementById("cWeek").onclick=function(){copyFrom(shift(cur,-7))};
document.getElementById("cGo").onclick=function(){
  var v=document.getElementById("cDate").value;
  if(v) copyFrom(v);
};
document.getElementById("copyClose").onclick=closeAll;

/* ---------- hours ---------- */
var hStart=document.getElementById("hStart"),hEnd=document.getElementById("hEnd");
for(var h=0;h<24;h++) hStart.add(new Option(h===0?"12:00 AM (midnight)":slotLabel(h*4),h));
for(var h2=1;h2<=24;h2++) hEnd.add(new Option(h2===24?"12:00 AM (midnight)":slotLabel(h2*4),h2));
document.getElementById("mHours").onclick=function(){
  hStart.value=settings.start; hEnd.value=settings.end;
  open(document.getElementById("hoursSheet"));
};
document.getElementById("hSave").onclick=function(){
  var a=+hStart.value,b=+hEnd.value;
  if(b<=a){ alert("The end time has to be after the start time."); return; }
  settings={start:a,end:b};
  localStorage.setItem("planner.settings",JSON.stringify(settings));
  closeAll(); render(); scrollToNow();
};
document.getElementById("hoursClose").onclick=closeAll;

/* ---------- backup ---------- */
document.getElementById("mExport").onclick=function(){
  closeAll();
  var out={};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf("planner.")===0) out[k]=localStorage.getItem(k);
  }
  var blob=new Blob([JSON.stringify({app:"planner",saved:new Date().toISOString(),data:out},null,1)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="planner-"+iso(new Date())+".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
};
var fileIn=document.getElementById("fileIn");
document.getElementById("mImport").onclick=function(){closeAll();fileIn.click()};
fileIn.addEventListener("change",function(){
  var f=fileIn.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j.data) throw 0;
      var n=Object.keys(j.data).length;
      if(!confirm("Load "+n+" saved items? Days with the same date are replaced.")) return;
      for(var k in j.data) localStorage.setItem(k,j.data[k]);
      try{var s2=JSON.parse(localStorage.getItem("planner.settings"));if(s2&&s2.start!=null)settings=s2}catch(e){}
      try{var s3=JSON.parse(localStorage.getItem(ITEMS_KEY));items=Array.isArray(s3)?s3:[]}catch(e){items=[]}
      day=readDay(cur); render(); renderList();
    }catch(e){ alert("That file is not a planner backup."); }
  };
  r.readAsText(f);
  fileIn.value="";
});

/* ================= LIST VIEW =================
   Items are independent of the day grid: one flat list, every day at once.
   { id, t: title, d: due date "YYYY-MM-DD" or "", s: subject, st: 0|1|2, n: note }
   st  0 = not started   1 = scheduled   2 = done
*/
var ITEMS_KEY="planner.items";
var items=[];
try{ var raw=JSON.parse(localStorage.getItem(ITEMS_KEY)); if(Array.isArray(raw)) items=raw; }catch(e){}

var listEl=document.getElementById("list");
var vtitle=document.getElementById("vtitle");
var addBtn=document.getElementById("addBtn");
var tabDay=document.getElementById("tabDay");
var tabList=document.getElementById("tabList");
var tabCount=document.getElementById("tabCount");
var view="day", dayScroll=0, listScroll=0;

function saveItems(){ localStorage.setItem(ITEMS_KEY,JSON.stringify(items)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function findItem(id){ for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i]; return null; }

var SECT=["Overdue","Due today","Next 7 days","Later","No due date","Done"];
function bucket(it,today,weekOut){
  if(it.st===2) return 5;
  if(!it.d) return 4;
  if(it.d<today) return 0;
  if(it.d===today) return 1;
  if(it.d<=weekOut) return 2;
  return 3;
}

function dueHTML(d,done){
  if(!d) return '<span class="nod">&mdash;</span>';
  var dt=parseISO(d);
  return MO[dt.getMonth()]+" "+dt.getDate()+'<div class="wd">'+WD[dt.getDay()]+"</div>";
}

function renderList(){
  var today=iso(new Date()), weekOut=shift(today,7);
  var sorted=items.slice().sort(function(a,b){
    var ba=bucket(a,today,weekOut), bb=bucket(b,today,weekOut);
    if(ba!==bb) return ba-bb;
    if(a.d!==b.d) return (a.d||"9999")<(b.d||"9999")?-1:1;
    return a.t.toLowerCase()<b.t.toLowerCase()?-1:1;
  });

  if(!sorted.length){
    listEl.innerHTML='<div class="empty">Nothing on the list yet.<br>Tap + to add an assignment, reading or anything else you owe.</div>';
    updateBadge();
    return;
  }

  var out=['<div class="legend">Tap the box to cycle: empty = not started, filled = scheduled, &#10003; = done.</div>'], last=-1;
  for(var k=0;k<sorted.length;k++){
    var it=sorted[k], b=bucket(it,today,weekOut);
    if(b!==last){
      out.push('<div class="sect'+(b===0?" red":"")+'">'+SECT[b]+"</div>");
      last=b;
    }
    out.push(
      '<div class="item'+(it.st===2?" done":"")+'" data-id="'+esc(it.id)+'">'+
        '<div class="due'+(b===0?" over":"")+'">'+dueHTML(it.d)+"</div>"+
        '<div class="st">'+
          '<button class="box s'+it.st+'" tabindex="-1" aria-label="Status: '+
            ["not started","scheduled","done"][it.st]+'"><i>'+(it.st===2?"&#10003;":"")+"</i></button>"+
        "</div>"+
        '<div class="itext'+(it.n?" note":"")+'">'+
          '<div class="ttl">'+esc(it.t)+"</div>"+
          (it.s?'<div class="sub">'+esc(it.s)+"</div>":"")+
          '<span class="flag"></span>'+
        "</div>"+
      "</div>");
  }
  listEl.innerHTML=out.join("");
  updateBadge();
}

/* Red count on the tab: anything unfinished that is due today or already late. */
function updateBadge(){
  var today=iso(new Date()), n=0;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.st!==2&&it.d&&it.d<=today) n++;
  }
  tabCount.textContent=n?String(n):"";
}

function cycleStatus(id,row){
  var it=findItem(id); if(!it) return;
  var wasDone=(it.st===2);
  it.st=(it.st+1)%3;
  saveItems();
  if(wasDone!==(it.st===2)){
    var y=window.scrollY; renderList(); window.scrollTo(0,y);
    return;
  }
  var box=row.querySelector(".box");
  box.className="box s"+it.st;
  box.querySelector("i").innerHTML=(it.st===2?"&#10003;":"");
  box.setAttribute("aria-label","Status: "+["not started","scheduled","done"][it.st]);
  updateBadge();
}

listEl.addEventListener("click",function(e){
  var row=e.target.closest(".item"); if(!row) return;
  if(e.target.closest(".box")){ cycleStatus(row.dataset.id,row); return; }
  openItem(row.dataset.id);
});

/* ---------- item sheet ---------- */
var itemSheet=document.getElementById("itemSheet");
var iTitle=document.getElementById("iTitle"), iDue=document.getElementById("iDue");
var iSubj=document.getElementById("iSubj"), iNote=document.getElementById("iNote");
var iPick=document.getElementById("iPick");
var editing=null, pickSt=0;

function setPick(s){
  pickSt=s;
  var bs=iPick.children;
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle("on",+bs[i].dataset.s===s);
}
iPick.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(b) setPick(+b.dataset.s);
});

function fillSubjects(){
  var seen={}, out=[];
  for(var i=0;i<items.length;i++){
    var s=items[i].s;
    if(s&&!seen[s.toLowerCase()]){ seen[s.toLowerCase()]=1; out.push("<option value='"+esc(s)+"'>"); }
  }
  document.getElementById("subjList").innerHTML=out.join("");
}

function openItem(id){
  editing=id?findItem(id):null;
  fillSubjects();
  document.getElementById("itemH2").textContent=editing?"Edit item":"New item";
  document.getElementById("iDelete").hidden=!editing;
  iTitle.value=editing?editing.t:"";
  iDue.value=editing?(editing.d||""):"";
  iSubj.value=editing?(editing.s||""):"";
  iNote.value=editing?(editing.n||""):"";
  setPick(editing?editing.st:0);
  open(itemSheet);
  if(!editing) setTimeout(function(){iTitle.focus()},60);
}

document.getElementById("iSave").onclick=function(){
  var t=iTitle.value.trim();
  if(!t){ alert("Give the item a title."); iTitle.focus(); return; }
  var rec=editing||{id:uid()};
  rec.t=t;
  rec.d=iDue.value||"";
  rec.s=iSubj.value.trim();
  rec.n=iNote.value.trim();
  rec.st=pickSt;
  if(!editing) items.push(rec);
  saveItems(); closeAll(); renderList();
};

document.getElementById("iDelete").onclick=function(){
  if(!editing) return;
  if(!confirm("Delete “"+editing.t+"”?")) return;
  items=items.filter(function(x){return x.id!==editing.id});
  saveItems(); closeAll(); renderList();
};

document.getElementById("iNoDate").onclick=function(){ iDue.value=""; };
document.getElementById("itemClose").onclick=closeAll;
addBtn.onclick=function(){ openItem(null); };

document.getElementById("mClearDone").onclick=function(){
  closeAll();
  var n=items.filter(function(x){return x.st===2}).length;
  if(!n){ alert("Nothing finished to clear."); return; }
  if(!confirm("Delete "+n+" finished item"+(n===1?"":"s")+" for good?")) return;
  items=items.filter(function(x){return x.st!==2});
  saveItems(); renderList();
};

/* ---------- switching views ---------- */
function setView(v){
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  if(view===v) return;
  if(view==="day") dayScroll=window.scrollY; else listScroll=window.scrollY;
  view=v;
  var isDay=(v==="day");
  grid.hidden=!isDay;
  listEl.hidden=isDay;
  document.getElementById("prev").hidden=!isDay;
  document.getElementById("next").hidden=!isDay;
  document.getElementById("dateBtn").hidden=!isDay;
  vtitle.hidden=isDay;
  addBtn.hidden=isDay;
  todayBar.hidden=isDay?(cur===iso(new Date())):true;
  tabDay.classList.toggle("on",isDay);
  tabList.classList.toggle("on",!isDay);
  var m=document.getElementById("menuSheet");
  Array.prototype.forEach.call(m.querySelectorAll(".dayOnly"),function(b){b.hidden=!isDay});
  Array.prototype.forEach.call(m.querySelectorAll(".listOnly"),function(b){b.hidden=isDay});
  if(isDay){ markNow(); window.scrollTo(0,dayScroll); }
  else { renderList(); window.scrollTo(0,listScroll); }
}
tabDay.onclick=function(){setView("day")};
tabList.onclick=function(){setView("list")};
Array.prototype.forEach.call(document.querySelectorAll("#menuSheet .listOnly"),function(b){b.hidden=true});

/* ---------- clock ---------- */
var todayISO=iso(new Date());
setInterval(markNow,15000);
document.addEventListener("visibilitychange",function(){
  if(document.hidden) return;
  var t=iso(new Date());
  if(t!==todayISO){
    var wasOnToday=(cur===todayISO);
    todayISO=t;
    if(view==="list"){ renderList(); return; }
    updateBadge();
    if(wasOnToday){ go(t); return; }
  }
  markNow();
});

/* ---------- start ---------- */
render();
scrollToNow();
updateBadge();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
